name: Deploy docs site to Pages

on:
  push:
    branches: [main]
  # 배포가 깨졌을 때 코드 변경 없이 다시 돌릴 수 있게 해둔다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남기되 진행 중인 건 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      # 로컬 개발 버전과 맞춘다
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 문서 사이트는 src/를 그대로 번들한다. 타입이 깨진 상태가 배포되지 않도록
      # 빌드 전에 먼저 검사한다.
      - run: pnpm typecheck

      - run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
